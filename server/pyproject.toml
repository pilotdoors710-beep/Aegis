[project]
name = "aegis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.4",
    "openai>=3.49.0",
    "playwright>=1.65.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
